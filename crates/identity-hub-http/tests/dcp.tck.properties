# Config for the real, official Eclipse Dataspace TCK's `dcp-tck-runtime`
# container, bind-mounted into it at /etc/tck/config.properties by
# tests/dcp_tck.rs. See that file's module doc comment for what the
# resulting test run does and does not assert, and ../../ARCHITECTURE.md's
# "DCP TCK conformance snapshot" section for the full picture.
#
# Scoped to the Credential Service test packages only (this bootstrap does
# not run the TCK against its own Issuer Service mode - see
# ../../ARCHITECTURE.md):
dataspacetck.launcher=org.eclipse.dataspacetck.dcp.system.DcpSystemLauncher
dataspacetck.test.package=org.eclipse.dataspacetck.dcp.verification.presentation.cs,org.eclipse.dataspacetck.dcp.verification.issuance.cs

# The TCK's own embedded callback HTTP server (hosting its self-generated
# verifier/issuer/thirdparty/... DIDs and STS) always binds container port
# 8083 - fixed by the TCK runtime itself, not derived from this property's
# port number, which is used only to *construct* those DIDs' host:port
# strings (see BaseAssembly.parseDid upstream). Using host.docker.internal
# (not localhost) here, combined with `--add-host
# host.docker.internal:host-gateway` on the container, is required: this
# same identity-hub process (running natively on the host, not
# containerized) needs to resolve those TCK-hosted DIDs too, including the
# TCK resolving *its own* self-hosted DIDs from inside the container - a
# "hairpin" round trip back through the host's published port. See
# identity-hub-http::state::AppState::new's reqwest client comment for the
# matching host.docker.internal DNS override this process applies to make
# that resolution work from a plain (non-containerized) process. Must match
# TCK_CALLBACK_PORT in tests/dcp_tck.rs.
dataspacetck.callback.address=http://host.docker.internal:19183

# This process's own identity as booted by tests/dcp_tck.rs
# (Config::for_test / SERVER_PORT) - must match SERVER_PORT there.
dataspacetck.did.holder=did:web:host.docker.internal%3A19180:credential-service
dataspacetck.sts.url=http://host.docker.internal:19180/sts
dataspacetck.sts.client.id=tck-client
dataspacetck.sts.client.secret=tck-secret

# Pinned explicitly (BaseAssembly would otherwise derive the same value from
# dataspacetck.callback.address via its own parseDid("issuer")) so this
# process's own Config::trusted_issuer_dids (tests/dcp_tck.rs) can be wired
# to the identical, predictable DID rather than a value this file only
# implies. This is the TCK's own "issuer" role's DID - the one party
# EXPECTED_FAILURES' cs_06_05_01_credentialMessage_untrustedIssuer test
# proves this Credential Service must trust, and the third-party DID that
# same test signs its rejected token with must not equal.
dataspacetck.did.issuer=did:web:host.docker.internal%3A19183:issuer

# Fixed (not per-test-random) so a rerun's Storage API writes are
# predictable, and pinned explicitly (BaseAssembly would otherwise generate
# a random UUID) so this process's own Config::known_holder_pids
# (tests/dcp_tck.rs's TCK_HOLDER_PID) can be wired to the identical,
# predictable value: storage_write now checks an incoming CredentialMessage's
# holderPid against this allow-list (crate::validation::check_known_holder_pid,
# see identity_hub_http::handlers::storage_write's doc comment) rather than
# accepting every correlation id unconditionally. The TCK's own
# per-test-method override mechanism
# (dataspacetck.credentials.correlation.id.<method>) is not used, so every
# @HolderPid-annotated test parameter resolves to this same fixed value.
dataspacetck.credentials.correlation.id=bootstrap-correlation-id
