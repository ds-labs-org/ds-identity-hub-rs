# Its own workspace root on purpose - see
# ds-odrl-engine-rs/bench/ds-odrl-engine-rs/perf/Cargo.toml in the sibling
# dataspace repo for the precedent this follows: a bench-only binary that
# path-depends on this repo's own library crates without joining the root
# workspace (so it never enters `cargo test --workspace`/`cargo clippy
# --workspace --all-targets`).
[workspace]

[package]
name = "verifier-token"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Benchmark-only helper for ds-identity-hub-rs/bench: plays the DCP 'verifier' role against a running Credential Service - hosts a real did:web identity, seeds one credential via the Storage API, and mints fresh, genuinely-authenticated Presentation API bearer tokens on demand (GET /mint) for the k6 load test to use."

[dependencies]
identity-hub-core = { path = "../../crates/identity-hub-core" }
ds-dcp-core-rs = { git = "https://github.com/ds-labs-org/ds-dcp-core-rs", rev = "78ef8d0e25f496a6674fd916939c690af4735023" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
debug = false
